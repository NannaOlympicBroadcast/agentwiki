<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Workipedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .prose img { border-radius: 0.5rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .infobox { float: right; width: 300px; margin-left: 1.5rem; margin-bottom: 1rem; border: 1px solid #e5e7eb; padding: 1rem; background-color: #f9fafb; border-radius: 0.5rem; }
        @media (max-width: 640px) { .infobox { float: none; width: 100%; margin-left: 0; } }
    </style>
</head>
<body class="bg-white text-gray-900 leading-relaxed">
    <header class="border-b border-gray-200 py-4 px-6 mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">Workipedia</h1>
            <div class="text-sm text-gray-500">知识百科</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pb-20">
        <article class="prose prose-blue max-w-none">
            <h1 class="text-4xl font-extrabold mb-4 border-b pb-2">{{title}}</h1>
            
            <blockquote class="italic text-gray-600 border-l-4 border-blue-500 pl-4 mb-8">
                {{summary}}
            </blockquote>

            <!-- Infobox -->
            <aside class="infobox">
                <h2 class="text-lg font-bold mb-3 border-b pb-1 text-center">{{title}}</h2>
                {{#main_image}}
                <img src="{{main_image}}" alt="{{title}}" class="w-full h-auto mb-2">
                <p class="text-xs text-gray-500 text-center mb-4 italic">{{main_image_caption}}</p>
                {{/main_image}}
                <table class="w-full text-sm">
                    <tbody>
                        {{#info_rows}}
                        <tr class="border-b border-gray-100">
                            <th class="text-left py-2 pr-2 font-semibold text-gray-700 w-1/3">{{key}}</th>
                            <td class="py-2 text-gray-600">{{value}}</td>
                        </tr>
                        {{/info_rows}}
                    </tbody>
                </table>
            </aside>

            <div class="content">
                {{content_html}}
            </div>

            <section class="mt-12 pt-8 border-t border-gray-200">
                <h2 class="text-2xl font-bold mb-4">参考资料</h2>
                <ol class="list-decimal list-inside text-sm text-blue-600 space-y-1">
                    {{#references}}
                    <li><a href="{{url}}" target="_blank" class="hover:underline">{{title}}</a></li>
                    {{/references}}
                </ol>
            </section>
        </article>
    </main>

    <footer class="bg-gray-50 border-t border-gray-200 py-8 px-6 text-center text-sm text-gray-500">
        <p>由 Workipedia 自动生成 &copy; 2026</p>
    </footer>
</body>
</html>
